name: Sync Assets From onmyoji-flow

on:
  workflow_dispatch:
  schedule:
    # Thu/Fri 17:30 CST, GitHub cron uses UTC.
    - cron: '30 9 * * 4,5'

permissions:
  contents: write

concurrency:
  group: sync-assets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout onmyoji-wiki
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout onmyoji-flow
        uses: actions/checkout@v6
        with:
          repository: FiresChain/onmyoji-flow
          ref: master
          path: .upstream/onmyoji-flow

      - name: Sync selected directories
        run: |
          set -eux
          for dir in Shikigami Yuhun HunLing Onmyoji OnmyojiSkill Other; do
            rsync -av --delete ".upstream/onmyoji-flow/public/assets/${dir}/" "public/assets/${dir}/"
          done

      - name: Commit and push if changed
        run: |
          set -eux
          if git diff --quiet -- public/assets && [ -z "$(git status --short -- public/assets)" ]; then
            echo "No asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          git commit -m "chore: sync assets from onmyoji-flow"
          git push origin HEAD:main
